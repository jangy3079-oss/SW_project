spring:
  datasource:
    url: jdbc:h2:mem:donga_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

  task:
    scheduling:
      enabled: false

jwt:
  secret: test-secret-key-for-integration-tests-only-1234567890
  access-token-validity: 900000
  refresh-token-validity: 1209600000

file:
  upload-dir: uploads/test
